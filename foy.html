<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELK MASTER — Baskı Föyü</title>
<style>
  :root{--ink:#1b2430;--soft:#5d6878;--line:#d9dee5;--acc:#0b5cad;--paper:#fff;--bg:#f3f5f8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:14.5px;line-height:1.6}
  .bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .bar b{font-size:15px;margin-right:6px}
  .bar select,.bar button,.bar label{font:inherit;font-size:13.5px}
  .bar select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;max-width:260px}
  .bar button{padding:7px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
  .bar button.ghost{background:#e9eef4;color:var(--ink)}
  .bar label{display:flex;gap:5px;align-items:center;color:var(--soft)}
  .page{max-width:820px;margin:18px auto;padding:0 16px 60px}
  .kapak{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 26px;margin-bottom:18px}
  .kapak h1{margin:0 0 4px;font-size:26px}
  .kapak .s{color:var(--soft)}
  .kapak ol{columns:2;column-gap:28px;margin:14px 0 0;padding-left:22px;font-size:13px}
  .mod{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin:0 0 18px}
  .mod h2{margin:0;font-size:20px;border-bottom:2px solid var(--ink);padding-bottom:6px}
  .mod .kat{color:var(--soft);font-size:12.5px;margin:4px 0 12px}
  .mod h3{font-size:15.5px;margin:18px 0 6px;color:#0f2c4d}
  .ozet{background:#f6f8fb;border-left:4px solid var(--acc);padding:10px 14px;border-radius:6px;margin:8px 0 12px}
  .mod table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
  .mod th,.mod td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
  .mod th{background:#eef2f6}
  .sema{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:8px;break-inside:avoid;page-break-inside:avoid}
  .sema .sb{font-size:12.5px;font-weight:700;margin:0 0 6px;color:#0f2c4d}
  .sema svg{width:100%;height:auto;display:block;}
  .semalar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .semalar .sema{margin:0}
  .ornek{border:1px dashed #b98a3c;background:#fffaf0;padding:6px 10px;border-radius:6px;margin:6px 0}
  .muted{color:var(--soft)}
  .secbox{margin:0 0 6px}
  .sechead{font-size:15.5px;margin:18px 0 8px;padding-bottom:4px;border-bottom:1.5px solid var(--ink);display:flex;gap:8px}
  .secno{color:var(--acc);font-weight:800}
  .para{margin:0 0 8px}
  .defrow{display:grid;grid-template-columns:30% 1fr;gap:2px 12px;padding:5px 0;border-bottom:1px dashed var(--line);break-inside:avoid}
  .defterm{font-weight:700}
  .bulcard{margin:4px 0 10px;padding-left:20px}
  .exline{display:flex;gap:8px;border:1px dashed #b98a3c;background:#fffaf0;padding:6px 10px;border-radius:6px;margin:6px 0 10px;break-inside:avoid}
  .ex-ic{font-size:9pt;font-weight:800;color:#8a5a00}
  .alertbox{border-left:3px solid #a15c00;padding:6px 10px;margin:8px 0;background:#fff7ea;break-inside:avoid}
  .alertbox.ab-danger{border-color:#b3261e;background:#fdf0ef}
  .alertbox.ab-tip{border-color:#1e7b3c;background:#eef7f0}
  .alertbox.ab-field{border-color:#0b5cad;background:#eef4fb}
  .tblwrap{margin:8px 0}
  .figwrap{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px;break-inside:avoid}
  .fighead{font-size:12.5px;font-weight:700;margin:0 0 6px;color:#0f2c4d}
  .figwrap figure{margin:0}
  .figwrap svg{width:100%;height:auto;display:block;max-width:150mm;margin:0 auto}
  .fml{font-family:Consolas,monospace;background:#eef2f6;padding:0 4px;border-radius:3px}
  .toparla{border:1.5px solid var(--ink);border-radius:8px;padding:10px 14px;margin:14px 0 0;break-inside:avoid}
  .toparla-h{font-weight:800;font-size:11px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
  @media (max-width:640px){.semalar{grid-template-columns:1fr}.kapak ol{columns:1}}
  @media print{
    @page{size:A4;margin:14mm 12mm 16mm;@bottom-center{content:"ELK MASTER · " counter(page);font-size:8pt;color:#666}}
    body{background:#fff;font-size:10.5pt;line-height:1.45}
    .bar{display:none}
    .page{max-width:none;margin:0;padding:0}
    .kapak,.mod{border:0;padding:0;margin:0;border-radius:0}
    .kapak{page-break-after:always}
    .mod{break-inside:auto;margin-bottom:8mm;padding-top:4mm;border-top:1.5pt solid #222}
    body.tam .mod{page-break-before:always;border-top:0}
    .mod h2,.mod .kat{break-after:avoid}
    .sema{break-inside:avoid}
    .ozet{background:#fff;border:1px solid #999;border-left:4px solid #333}
    .mod h3{page-break-after:avoid}
    a{color:inherit;text-decoration:none}
    .semalar{grid-template-columns:1fr}
    .sema svg{max-width:140mm;margin:0 auto}
  }
</style>
</head>
<body>
<div class="bar">
  <b>Baskı Föyü</b>
  <select id="modSec" onchange="ciz()"></select>
  <select id="tur" onchange="ciz()">
    <option value="ozet">Özet + şemalar (kısa)</option>
    <option value="tam">Tam teori (uzun)</option>
    <option value="yalnizozet">Sadece özet</option>
  </select>
  <button class="ghost" onclick="window.print()">Yazdır / PDF</button>
  <a href="index.html" class="muted" style="margin-left:auto;font-size:13px">← Uygulamaya dön</a>
</div>
<div class="page" id="out"></div>

<script>var ELK_ICERIK={};</script>
<script src="js/veri.js"></script>

<script>
(function(){ for(var k in ELK_ICERIK){ var c=ELK_ICERIK[k]; if(c.teori) TEORI[+k]=c.teori.replace(/🔎\s*/g,''); if(c.ozet) FOY[+k]=c.ozet; } })();

/* Program sırasına göre modüller (Saha Programı aşamaları), kalanlar sona */
function sirali(){
  var ids=[]; (typeof PROGRAM!=='undefined'?PROGRAM:[]).forEach(function(a){a.mods.forEach(function(i){ if(ids.indexOf(i)<0 && MODS.some(function(m){return m.id===i;})) ids.push(i); });});
  MODS.forEach(function(m){ if(ids.indexOf(m.id)<0) ids.push(m.id); });
  return ids.map(function(i){return MODS.find(function(m){return m.id===i;});});
}
function temizBaslik(s){ return s.replace(/<[^>]*>/g,'').replace(/^\s*(🔹\s*)?\d+\s*[).]\s*/,'').trim(); }

/* Teori metnini baskı düzenine çevir */
function teoriBaski(t,id){
  var h=icerikSusle(t,id).replace(/<nav class="tocbar">[\s\S]*?<\/nav>/,'');
  return h.replace(/<img[^>]*>/g,'');
}
function semalar(t){
  var out=[], re=/<div class="figwrap[^"]*"><div class="fighead">🔎\s*([\s\S]*?)<\/div>\s*<figure[^>]*>([\s\S]*?)<\/figure><\/div>/g, m;
  while((m=re.exec(t))) out.push('<div class="sema"><div class="sb">'+m[1].replace(/🔎\s*/g,'')+'</div>'+m[2]+'</div>');
  return out;
}
function modHTML(m,tur){
  var kat=(CATS[m.cat]||{}).n||'';
  var h='<section class="mod" id="m'+m.id+'"><h2>Modül '+m.id+' — '+m.t+'</h2><div class="kat">'+kat+' · '+m.d+'</div>';
  if(tur!=='tam') h+='<div class="ozet">'+foySusle(FOY[m.id]||'')+'</div>';
  if(tur==='ozet'){ var s=semalar(TEORI[m.id]||''); if(s.length) h+='<h3>Şemalar</h3><div class="semalar">'+s.join('')+'</div>'; }
  if(tur==='tam'){ h+=teoriBaski(TEORI[m.id]||'',m.id); if(FOY[m.id]) h+='<div class="toparla"><div class="toparla-h">Toparlama</div>'+foySusle(FOY[m.id])+'</div>'; }
  return h+'</section>';
}
function ciz(){
  var sec=document.getElementById('modSec').value, tur=document.getElementById('tur').value, liste=sirali();
  var h='';
  if(sec==='hepsi'){
    h+='<div class="kapak"><h1>ELK MASTER — Elektrik Eğitim Föyü</h1><div class="s">'+
      (tur==='tam'?'Tam teori':tur==='ozet'?'Özet + şemalar':'Özetler')+' · '+liste.length+' modül · program sırasıyla · v15 · '+new Date().toLocaleDateString('tr-TR')+'</div><ol>'+
      liste.map(function(m){return '<li>'+m.t+' <span class="muted">(M'+m.id+')</span></li>';}).join('')+'</ol></div>';
    liste.forEach(function(m){ h+=modHTML(m,tur); });
  } else h+=modHTML(MODS.find(function(m){return m.id===+sec;}),tur);
  document.getElementById('out').innerHTML=h; document.body.classList.toggle('tam',tur==='tam');
  try{ history.replaceState(null,'','#'+sec+'-'+tur); }catch(e){}
}
(function(){
  var s=document.getElementById('modSec');
  s.innerHTML='<option value="hepsi">Tüm modüller</option>'+sirali().map(function(m){return '<option value="'+m.id+'">M'+m.id+' — '+m.t+'</option>';}).join('');
  var hsh=(location.hash||'').slice(1).split('-');
  if(hsh[0]) s.value=hsh[0]; else document.getElementById('tur').value='yalnizozet';
  if(hsh[1]) document.getElementById('tur').value=hsh[1];
  ciz();
})();
</script>
</body>
</html>
